<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 240" width="430" height="240" role="img" aria-label="Pallarium clicks and types in a real browser for you">
<title>Pallarium clicks and types in a real browser for you</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.d{animation-duration:9s;animation-iteration-count:infinite;animation-fill-mode:both}
.cur{animation-name:cur;animation-timing-function:ease-in-out}
@keyframes cur{0%{transform:translate(360px,212px)}12%,38%{transform:translate(150px,112px)}46%,58%{transform:translate(150px,152px)}66%,92%{transform:translate(96px,196px)}100%{transform:translate(360px,212px)}}
.rip{transform-box:fill-box;transform-origin:center;animation-name:rip}
@keyframes rip{0%,66%{opacity:0;transform:scale(.3)}68%{opacity:.8;transform:scale(.6)}80%,100%{opacity:0;transform:scale(1.8)}}
.f1{animation-name:f1}@keyframes f1{0%,12%{stroke:#2b2b32}14%,40%{stroke:#D9A441}44%,100%{stroke:#2b2b32}}
.f2{animation-name:f2}@keyframes f2{0%,46%{stroke:#2b2b32}48%,60%{stroke:#D9A441}64%,100%{stroke:#2b2b32}}
@keyframes ok{0%,70%{opacity:0;transform:translateY(4px)}72.5%,92%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
.ok{animation-name:ok}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="430" height="240" rx="16" fill="#0c0c0e"/><rect x=".5" y=".5" width="429" height="239" rx="16" fill="none" stroke="#2b2b32"/>
<rect x="16" y="16" width="398" height="208" rx="10" fill="#0f0f12" stroke="#2b2b32"/>
