<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="Pallarium's living systems orbit its core">
<title>Pallarium's living systems orbit its core</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(.97)}36%{transform:scale(1.05)}52%{transform:scale(1)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.2s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.3;transform:scale(1)}15%{opacity:.8;transform:scale(1.18)}52%{opacity:.35;transform:scale(1)}}
.flow{stroke-dasharray:3 9;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.lit{animation:lit 7s ease-in-out infinite}
@keyframes lit{0%{opacity:0}7%{opacity:1}20%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
