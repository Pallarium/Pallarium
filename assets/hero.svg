<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="hl"><stop offset="0" stop-color="#D9A441" stop-opacity=".6"/><stop offset="1" stop-color="#D9A441" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy="1.15" r=".85"><stop offset="0" stop-color="#4a3310" stop-opacity=".7"/><stop offset="1" stop-color="#0c0c0e" stop-opacity="0"/></radialGradient>
