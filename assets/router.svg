.mono{font-family:ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
