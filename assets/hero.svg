<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Pallarium. It only takes one step to make your dream.">
<title>Pallarium. It only takes one step to make your dream.</title>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace}
.shine{animation:shine 5.5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-320px)}55%,100%{transform:translateX(1180px)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(.97)}36%{transform:scale(1.04)}52%{transform:scale(1)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.35;transform:scale(1)}15%{opacity:.8;transform:scale(1.15)}52%{opacity:.4;transform:scale(1)}}
.t1{animation:t1 8s ease-out infinite}.t2{animation:t2 8s ease-out infinite}
@keyframes t1{0%,5%{opacity:0;transform:translateY(8px)}14%,90%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
@keyframes t2{0%,16%{opacity:0;transform:translateY(8px)}27%,90%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
.ember{animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(-200px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
