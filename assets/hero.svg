<g class="t1"><text x="440" y="202" text-anchor="middle" font-size="19" font-weight="500" fill="#F0EBE4">It only takes one step to make your dream.</text></g>
<g class="t2"><text x="440" y="229" text-anchor="middle" font-size="15" font-style="italic" fill="#a09a90">But you have to be the one to walk through the door.</text></g>
