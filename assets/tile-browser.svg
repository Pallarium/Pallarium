<rect class="d f2" x="40" y="136" width="230" height="30" rx="7" fill="#1b1b21" stroke="#2b2b32" stroke-width="1.5"/>
<clipPath id="bt1"><rect x="50" y="98" width="200" height="26"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;200;200" keyTimes="0;.15;.36;1"/></rect></clipPath>
<clipPath id="bt2"><rect x="50" y="138" width="200" height="26"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;200;200" keyTimes="0;.48;.58;1"/></rect></clipPath>
<g clip-path="url(#bt1)"><text x="52" y="115.5" font-size="12" fill="#F0EBE4">sam@mail.com</text></g>
<g clip-path="url(#bt2)"><text x="52" y="156" font-size="13" letter-spacing="2" fill="#F0EBE4">••••••••</text></g>
<rect x="40" y="180" width="112" height="32" rx="16" fill="#D9A441"/>
<text x="96" y="200.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1206">Sign up</text>
<circle class="d rip" cx="96" cy="196" r="22" fill="none" stroke="#F4CF7E" stroke-width="2"/>
<g class="d ok"><rect x="286" y="180" width="112" height="32" rx="16" fill="rgba(114,211,154,.14)" stroke="rgba(114,211,154,.5)"/><path d="M302 196.5l3.2 3.2 6.3 -6.5" fill="none" stroke="#72d39a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="318" y="200.5" font-size="12" font-weight="600" fill="#72d39a">Signed up</text></g>
<g class="d cur"><path d="M0 0 L0 17 L4.6 12.6 L7.7 19.4 L10.4 18.2 L7.4 11.6 L13 11.6 Z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></g>
