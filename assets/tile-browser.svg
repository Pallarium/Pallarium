<line x1="16" y1="46.5" x2="414" y2="46.5" stroke="#2b2b32"/>
<circle cx="30" cy="31" r="3.5" fill="#ff5f57" opacity=".8"/>
<circle cx="41" cy="31" r="3.5" fill="#febc2e" opacity=".8"/>
<circle cx="52" cy="31" r="3.5" fill="#28c840" opacity=".8"/>
<rect x="80" y="22" width="290" height="18" rx="9" fill="#0f0f12" stroke="#2b2b32"/>
<rect x="91" y="28.5" width="7" height="6" rx="1.2" fill="#72d39a"/><path d="M92.3 28.5v-1.6a2.2 2.2 0 0 1 4.4 0v1.6" fill="none" stroke="#72d39a" stroke-width="1.1"/>
<text x="104" y="35" font-size="10.5" fill="#a09a90">example.com/signup</text>
<text x="40" y="78" font-size="15" font-weight="700" fill="#F0EBE4">Create an account</text>
